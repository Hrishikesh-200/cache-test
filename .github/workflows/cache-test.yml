name: Cache Priming Demo

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  cache-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: prime-cache-93f149c
        id: cache-step
        uses: actions/cache@v4
        with:
          path: ~/.cache/demo           # Change this path to match your dependencies (for demo)
          key: cache-93f149c

      - name: Show cache hit/miss
        run: |
          if [[ "${{ steps.cache-step.outputs.cache-hit }}" == "true" ]]; then
            echo "Cache HIT for cache-93f149c"
          else
            echo "Cache MISS for cache-93f149c"
          fi
