name: Cache Dependencies Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  cache-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Prime cache - cache-93f149c
        id: prime-cache-93f149c
        uses: actions/cache@v4
        with:
          path: ~/.cache/dependencies
          key: cache-93f149c

      - name: Show cache result
        run: |
          if [ "${{ steps.prime-cache-93f149c.outputs.cache-hit }}" == "true" ]; then
            echo "Cache hit ✅"
          else
            echo "Cache miss ❌"
          fi

      - name: Install dependencies (example)
        run: |
          mkdir -p ~/.cache/dependencies
          echo "dependency-data" > ~/.cache/dependencies/example.txt
